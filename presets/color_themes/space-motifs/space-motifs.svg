<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Space motif kit. Line motifs draw with currentColor so they inherit
       the slide's ink or muted color; accent details use var(--color-accent)
       with a currentColor fallback. All strokes are non-scaling-friendly at
       the intended 1x–3x sizes. Usage:
       <svg class="motif" viewBox="0 0 240 240"><use href="space-motifs.svg#orbit-system"/></svg> -->

  <!-- Single elliptical orbit with body and direction node -->
  <symbol id="orbit-arc" viewBox="0 0 240 240">
    <ellipse cx="120" cy="120" rx="104" ry="64" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-18 120 120)"/>
    <circle cx="120" cy="120" r="14" fill="currentColor"/>
    <circle cx="212" cy="88" r="7" fill="var(--color-accent, currentColor)"/>
    <path d="M204 72 L220 80 L206 92" fill="none" stroke="var(--color-accent, currentColor)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Two-body system: primary, moon, nested orbits -->
  <symbol id="orbit-system" viewBox="0 0 240 240">
    <ellipse cx="120" cy="120" rx="106" ry="70" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-14 120 120)"/>
    <ellipse cx="120" cy="120" rx="64" ry="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 6" transform="rotate(-14 120 120)"/>
    <circle cx="120" cy="120" r="16" fill="currentColor"/>
    <circle cx="181" cy="96" r="6" fill="var(--color-accent, currentColor)"/>
    <circle cx="20" cy="146" r="4" fill="currentColor"/>
  </symbol>

  <!-- Planet with ring -->
  <symbol id="planet-ring" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="52" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <ellipse cx="120" cy="120" rx="98" ry="26" fill="none" stroke="var(--color-accent, currentColor)" stroke-width="2" transform="rotate(-16 120 120)"/>
  </symbol>

  <!-- Moon disc with terminator -->
  <symbol id="moon-terminator" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="70" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M120 50 A70 70 0 0 1 120 190 A38 70 0 0 0 120 50 Z" fill="currentColor" opacity=".28"/>
    <circle cx="98" cy="96" r="9" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
    <circle cx="106" cy="146" r="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
  </symbol>

  <!-- Globe graticule -->
  <symbol id="graticule" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="72" fill="none" stroke="currentColor" stroke-width="2"/>
    <ellipse cx="120" cy="120" rx="72" ry="26" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <ellipse cx="120" cy="120" rx="26" ry="72" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <line x1="48" y1="120" x2="192" y2="120" stroke="currentColor" stroke-width="1.2"/>
    <line x1="120" y1="48" x2="120" y2="192" stroke="currentColor" stroke-width="1.2"/>
  </symbol>

  <!-- Sparse starfield tile: use once or twice per deck, at low opacity -->
  <symbol id="starfield-sparse" viewBox="0 0 240 240">
    <g fill="currentColor">
      <circle cx="28" cy="42" r="2.4"/><circle cx="96" cy="20" r="1.4"/>
      <circle cx="176" cy="52" r="1.8"/><circle cx="222" cy="16" r="1.2"/>
      <circle cx="58" cy="126" r="1.3"/><circle cx="150" cy="106" r="2.2"/>
      <circle cx="206" cy="150" r="1.4"/><circle cx="34" cy="204" r="1.7"/>
      <circle cx="118" cy="188" r="1.2"/><circle cx="188" cy="222" r="2.1"/>
    </g>
    <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M76 74 h10 M81 69 v10"/>
      <path d="M132 224 h8 M136 220 v8"/>
    </g>
  </symbol>

  <!-- Instrument reticle / pointing crosshair -->
  <symbol id="reticle" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="58" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="120" cy="120" r="3.5" fill="var(--color-accent, currentColor)"/>
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="120" y1="34" x2="120" y2="70"/>
      <line x1="120" y1="170" x2="120" y2="206"/>
      <line x1="34" y1="120" x2="70" y2="120"/>
      <line x1="170" y1="120" x2="206" y2="120"/>
    </g>
    <g stroke="currentColor" stroke-width="1.2">
      <line x1="120" y1="88" x2="120" y2="96"/><line x1="120" y1="144" x2="120" y2="152"/>
      <line x1="88" y1="120" x2="96" y2="120"/><line x1="144" y1="120" x2="152" y2="120"/>
    </g>
  </symbol>

  <!-- Trajectory arc with arrowhead and burn tick -->
  <symbol id="trajectory" viewBox="0 0 240 240">
    <path d="M20 200 C70 190 150 150 204 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M196 74 L206 52 L214 74" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="118" y1="140" x2="132" y2="152" stroke="var(--color-accent, currentColor)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="200" r="5" fill="currentColor"/>
  </symbol>

  <!-- Spectral bars: three data-colored bands over a baseline -->
  <symbol id="spectral-band" viewBox="0 0 240 240">
    <line x1="24" y1="176" x2="216" y2="176" stroke="currentColor" stroke-width="2"/>
    <rect x="44" y="118" width="14" height="58" fill="var(--color-data-1, currentColor)"/>
    <rect x="92" y="76" width="14" height="100" fill="var(--color-accent, currentColor)"/>
    <rect x="140" y="132" width="14" height="44" fill="var(--color-data-2, currentColor)"/>
    <rect x="182" y="150" width="14" height="26" fill="currentColor" opacity=".55"/>
    <g stroke="currentColor" stroke-width="1.2">
      <line x1="51" y1="176" x2="51" y2="182"/><line x1="99" y1="176" x2="99" y2="182"/>
      <line x1="147" y1="176" x2="147" y2="182"/><line x1="189" y1="176" x2="189" y2="182"/>
    </g>
  </symbol>

  <!-- Ground-station antenna -->
  <symbol id="ground-station" viewBox="0 0 240 240">
    <path d="M70 96 A62 62 0 0 1 176 140" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="123" y1="118" x2="150" y2="86" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="154" cy="80" r="6" fill="var(--color-accent, currentColor)"/>
    <path d="M108 132 L96 196 M138 128 L152 196 M84 196 h84" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
