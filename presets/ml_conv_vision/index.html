<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evrişimli Görü Preseti</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      color-scheme: dark;
      /* obsidian-champagne ailesi — deste jetonları (design-space-science-deck) */
      --color-canvas: #0F1013;
      --color-surface: #1A1C21;
      --color-ink: #F4EEE1;
      --color-muted: #A9A296;
      --color-accent: #D3B26A;
      --color-rule: #2E3037;
      --color-data-1: #5590C9;
      --color-data-2: #C86A40;
      --color-data-3: #6FBF9A;
      --color-data-4: #A88BD9;
      --ramp-seq-1: #14161B; --ramp-seq-2: #4A4030; --ramp-seq-3: #7D6A42;
      --ramp-seq-4: #A88E54; --ramp-seq-5: #D3B26A;
      --ramp-div-1: #5590C9; --ramp-div-2: #55606E; --ramp-div-3: #33353C;
      --ramp-div-4: #8A5A3E; --ramp-div-5: #C86A40;
      --motion-ease: cubic-bezier(.22, .8, .24, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 32px 20px;
      background: var(--color-canvas); color: var(--color-ink);
      font: 500 17px/1.45 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    }
    main { max-width: 1920px; margin: auto; display: grid; gap: 18px; }
    /* Sahne kabı: mount'tan ÖNCE boyutlanır (gizli sekme ResizeObserver
       teslim etmez) — 16:9 oran kilidi ile. */
    #host { width: 100%; aspect-ratio: 16 / 9; }
    #host:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 4px; }
    .cvp-status {
      margin: 0; min-height: 1.4em;
      font: 500 15px/1.4 "IBM Plex Mono", ui-monospace, monospace;
      color: var(--color-muted);
    }
    .cvp-controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 16px;
      border: 1.5px solid var(--color-rule); border-radius: 12px;
      background: var(--color-surface);
    }
    .cvp-controls button {
      border: 1.5px solid var(--color-rule); border-radius: 999px;
      background: transparent; color: var(--color-ink);
      padding: 7px 15px; font: 600 14px/1 inherit; cursor: pointer;
    }
    .cvp-controls button[data-primary] {
      background: var(--color-ink); border-color: var(--color-ink); color: var(--color-canvas);
    }
    .cvp-controls button[aria-pressed="true"] {
      background: var(--color-accent); border-color: var(--color-accent); color: #191307;
    }
    .cvp-controls .group {
      display: inline-flex; align-items: center; gap: 6px;
      padding-left: 12px; border-left: 1.5px solid var(--color-rule);
    }
    .cvp-controls .group > span {
      font: 600 12px/1 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .08em; text-transform: uppercase; color: var(--color-muted);
    }
    .cvp-controls :focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    .cvp-help { margin: 0; color: var(--color-muted); font-size: 14px; }
    html[data-export="true"] [data-export-hide] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .cvp-controls button[data-motion-only] { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div id="host" tabindex="0"></div>
    <p class="cvp-status" id="status-slot"></p>
    <div class="cvp-controls" data-export-hide role="group" aria-label="Sahne denetimleri">
      <button id="play" data-primary data-motion-only>Oynat</button>
      <button id="pause" data-motion-only>Duraklat</button>
      <button id="restart">Baştan</button>
      <span class="group" role="group" aria-label="Aşama seçimi">
        <span>Aşama</span>
        <button data-stage="goruntu">Görüntü</button>
        <button data-stage="kaydir">Kayan pencere</button>
        <button data-stage="haritalar">Haritalar</button>
        <button data-stage="havuz">Havuzlama</button>
        <button data-stage="relu">ReLU</button>
        <button data-stage="derin">Derin</button>
        <button data-stage="karar">Karar</button>
      </span>
      <span class="group" role="group" aria-label="Adım (stride)">
        <span>Adım</span>
        <button data-stride="1">1</button>
        <button data-stride="2">2</button>
        <button data-stride="3">3</button>
      </span>
      <span class="group" role="group" aria-label="Dolgu (padding)">
        <span>Dolgu</span>
        <button data-pad="0">0</button>
        <button data-pad="1">1</button>
        <button data-pad="2">2</button>
      </span>
      <span class="group" role="group" aria-label="Çekirdek seçimi">
        <span>Çekirdek</span>
        <select id="filter" style="padding:7px 10px;border-radius:8px;background:var(--color-canvas);
          color:var(--color-ink);border:1.5px solid var(--color-rule);font:600 14px/1 inherit"></select>
      </span>
      <span class="group" role="group" aria-label="Girdi görüntüsü">
        <span>Girdi</span>
        <button data-image="rakam">Rakam</button>
        <button data-image="desen">Desen</button>
      </span>
    </div>
    <p class="cvp-help" data-export-hide>
      ←/→ aşama · Boşluk oynat/duraklat · Deterministik bağlantı parametreleri:
      <code>?sahne=kaydir&amp;adim=120&amp;filtre=sobel-x&amp;stride=2&amp;dolgu=1&amp;goruntu=rakam</code>
      (<code>?t=</code> saniye cinsinden ham konum — yalnız doğrulama içindir).
    </p>
  </main>

  <script type="module">
    import { mountConvVision, FILTER_LIST, STAGES } from './conv-vision.mjs';

    const params = new URLSearchParams(location.search);
    /* ?disaAktarim=1 — dışa aktarım kipini mount'tan ÖNCE açar. Yalnızca
       başsız doğrulama içindir; gerçek dışa aktarımda bayrağı deste kurar. */
    if (params.get('disaAktarim') === '1') document.documentElement.dataset.export = 'true';
    const num = (k, fb) => (params.has(k) && !Number.isNaN(Number(params.get(k))) ? Number(params.get(k)) : fb);
    const sahne = params.get('sahne');
    const adim = params.has('adim') ? num('adim', 0) : undefined;
    const tParam = params.has('t') ? num('t', 0) : undefined;

    const host = document.querySelector('#host');
    const cv = mountConvVision(host, {
      active: true,
      image: params.get('goruntu') || 'rakam',
      filter: params.get('filtre') || 'sobel-x',
      stride: num('stride', 1),
      pad: num('dolgu', 0),
      stage: sahne || undefined,
      adim,
      seekTo: tParam,
      /* ?adim= ya da ?t= verildiyse kare DONDURULUR (başsız doğrulama);
         verilmediyse sahne kendiliğinden akar. */
      autoplay: adim === undefined && tParam === undefined,
    });
    window.__convVision = cv;   // denetim kancası

    /* durum satırını sahnenin ürettiği yere taşı (mount host'un içine koyar) */
    const slot = document.querySelector('#status-slot');
    const live = host.querySelector('.cvp-status');
    if (live && slot) { slot.replaceWith(live); }

    const q = sel => Array.from(document.querySelectorAll(sel));
    const syncPressed = () => {
      const s = cv.state;
      q('[data-stage]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stage === s.stage)));
      q('[data-stride]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.stride) === s.stride)));
      q('[data-pad]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.pad) === s.pad)));
      q('[data-image]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.image === s.image)));
    };

    const sel = document.querySelector('#filter');
    for (const k of FILTER_LIST) {
      const o = document.createElement('option');
      o.value = k.id; o.textContent = `${k.ad} — ${k.yakalar}`;
      sel.appendChild(o);
    }
    sel.value = cv.state.filter;
    sel.addEventListener('change', () => { cv.setFilter(sel.value); syncPressed(); });

    document.querySelector('#play').addEventListener('click', () => cv.play());
    document.querySelector('#pause').addEventListener('click', () => cv.pause());
    document.querySelector('#restart').addEventListener('click', () => { cv.restart(); syncPressed(); });
    q('[data-stage]').forEach(b => b.addEventListener('click', () => {
      cv.pause(); cv.setStage(b.dataset.stage); syncPressed();
    }));
    q('[data-stride]').forEach(b => b.addEventListener('click', () => {
      cv.setStride(Number(b.dataset.stride)); syncPressed();
    }));
    q('[data-pad]').forEach(b => b.addEventListener('click', () => {
      cv.setPad(Number(b.dataset.pad)); syncPressed();
    }));
    q('[data-image]').forEach(b => b.addEventListener('click', () => {
      cv.setImage(b.dataset.image); syncPressed();
    }));
    addEventListener('keydown', e => { if (e.key === 'Escape') cv.pause(); });
    setInterval(syncPressed, 400);
    syncPressed();

    /* Başsız doğrulama kancası: kare hazır olduğunda işaretle */
    document.documentElement.dataset.cvpReady = 'true';
  </script>
</body>
</html>
