<!doctype html>
<html lang="tr" data-palette="aurora-boreal-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aurora Preset — emisyon çizgileri, yükseklik, aktivite</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <script type="importmap">{ "imports": { "three": "../moon_advanced/vendor/three.module.min.js" } }</script>
  <link rel="stylesheet" href="../color_themes/palette-library.css">
  <link rel="stylesheet" href="../moon_react_source/components/moon_react_source.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0;
      background: var(--color-canvas, #06202B);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: 100%; height: 100%; padding: 22px; }
    main > div { width: 100%; height: 100%; }
    /* deterministik açılış bağlantıları — doğrulama/ekran görüntüsü için */
    #presets { position: fixed; left: 50%; top: 14px; z-index: 6; transform: translateX(-50%);
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      font-size: 13px; color: var(--color-muted, #2C9A6A); }
    #presets a { color: var(--color-ink, #3FD98A); text-decoration: none;
      border: 1px solid var(--color-rule, #165446); border-radius: 999px;
      padding: 4px 11px; background: rgba(4, 14, 20, .72); }
    #presets a:hover { border-color: var(--color-ink, #3FD98A); }
    #presets span { align-self: center; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
    [data-export="true"] #presets { display: none; }
  </style>
</head>
<body>
  <main><div id="host"></div></main>
  <nav id="presets" data-export-hide>
    <span>hazır durumlar</span>
    <a href="?kp=1&yogunluk=1&t=8">Kp 1 sakin yay</a>
    <a href="?kp=8.4&yogunluk=1&t=26">Kp 8.4 kopma</a>
    <a href="?kp=5&yogunluk=2.5&t=12">n×2,5 kırmızı sönük</a>
    <a href="?kp=5&yogunluk=0.4&t=12">n×0,4 kırmızı taç</a>
    <a href="?kp=7&cizgi=mavi,pembe&t=14">alt kenar</a>
    <a href="?kp=4&sanatsal=1&ton=0.78&t=10">serbest renk</a>
    <a href="?kp=2.5&kabuk=yok&t=18">deste fonu</a>
    <a href="?">canlı</a>
  </nav>
  <script type="module">
    import { mountAurora } from './aurora-sky.mjs';

    /* ---- deterministik açılış parametreleri ----
       ?kp=6&yogunluk=0.4&cizgi=yesil,kirmizi&t=3
       kp       : 0–9 aktivite            yogunluk : 0.35–2.6 atom yoğunluğu çarpanı
       cizgi    : yesil,kirmizi,mavi,pembe (listede olmayan çizgi 0'a iner)
       t        : verilirse sahne DONDURULUR ve tam t saniyeye ilerletilir
       sanatsal : 1 → serbest renk kipi   ton : 0–1 serbest renk tonu
       tohum    : yerleşim tohumu         export=1 : dışa aktarım tablosu     */
    const q = new URLSearchParams(location.search);
    const num = (key, fallback) => (q.has(key) && Number.isFinite(Number(q.get(key))) ? Number(q.get(key)) : fallback);
    const LINE_TR = { yesil: 'green', kirmizi: 'red', mavi: 'blue', pembe: 'pink' };

    /* dışa aktarımda sayfa kabuğu da (hazır durum bağlantıları) gizlenir */
    if (q.get('export') === '1') document.documentElement.dataset.export = 'true';

    const options = { seed: num('tohum', 20260814) };
    if (q.has('kp')) options.kp = num('kp', 4);
    if (q.has('yogunluk')) options.density = num('yogunluk', 1);
    if (q.get('kabuk') === 'yok') { options.chrome = 'none'; options.axis = false; }  /* deste fonu önizlemesi */
    if (q.has('sanatsal')) options.artistic = q.get('sanatsal') === '1';
    if (q.has('ton')) options.artHue = num('ton', 0.55);
    if (q.has('cizgi')) {
      const wanted = new Set(q.get('cizgi').split(',').map(s => LINE_TR[s.trim()]).filter(Boolean));
      options.lines = { green: 0, red: 0, blue: 0, pink: 0 };
      for (const key of wanted) options.lines[key] = 1;
    }
    /* t verildiyse: rAF hiç kurulmaz, sahne tam t saniyeye ilerletilir —
       kare kare karşılaştırılabilir, deterministik bir görüntü */
    const freezeAt = q.has('t') ? num('t', 0) : null;
    if (freezeAt !== null) options.active = false;

    const aurora = mountAurora(document.querySelector('#host'), options);
    window.__aurora = aurora;                     /* deterministik test/export sürüşü */

    if (freezeAt !== null) {
      const STEP = 1 / 60;
      for (let t = 0; t < freezeAt - 1e-9; t += STEP) aurora.advance(Math.min(STEP, freezeAt - t));
      document.documentElement.dataset.frozenAt = String(freezeAt);
    }
    aurora.figure.focus();
  </script>
</body>
</html>
