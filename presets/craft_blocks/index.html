<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Araç Blokları — craft_blocks</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <script type="importmap">{ "imports": { "three": "../moon_advanced/vendor/three.module.min.js" } }</script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #05070b; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif; color: #dfe3ea; }
    #stage { position: absolute; inset: 0; }
    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; pointer-events: none;
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: #c9a35c; }
    header h1 small { display: block; font-size: 10.5px; font-weight: 400; letter-spacing: 0.06em;
      text-transform: none; color: #8a90a0; margin-top: 3px; }
    .controls { display: flex; gap: 10px; align-items: center; pointer-events: auto; }
    select, button, label.chk {
      background: rgba(16, 19, 27, 0.85); color: #dfe3ea; border: 1px solid #2b303d;
      border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    }
    select:hover, button:hover, label.chk:hover { border-color: #c9a35c; }
    label.chk { display: flex; gap: 7px; align-items: center; user-select: none; }
    footer {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      display: flex; gap: 8px; justify-content: center; padding: 16px; pointer-events: none;
    }
    footer a {
      pointer-events: auto; text-decoration: none; color: #b9bfcc; font-size: 12px;
      background: rgba(16, 19, 27, 0.85); border: 1px solid #2b303d; border-radius: 999px;
      padding: 6px 14px;
    }
    footer a:hover, footer a.on { color: #0c0e14; background: #c9a35c; border-color: #c9a35c; }
    /* Ateşleme paneli — motor efekt sistemi kumandaları */
    #fxPanel {
      position: absolute; top: 68px; right: 22px; z-index: 5;
      display: flex; gap: 10px; align-items: center;
      background: rgba(10, 12, 18, 0.72); border: 1px solid #232837;
      border-radius: 12px; padding: 8px 12px;
    }
    #fxPanel .fx-baslik { font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: #c9a35c; }
    #fxPanel label.gaz { display: flex; gap: 8px; align-items: center;
      font-size: 12px; color: #b9bfcc; user-select: none; }
    #fxPanel input[type="range"] { width: 110px; accent-color: #c9a35c; }
    #atesleBtn.yanik { color: #0c0e14; background: #c9a35c; border-color: #c9a35c; }
    /* Kamera ipucu — sürükle/tekerlek/pan kısayolları */
    #ipucu {
      position: absolute; left: 22px; bottom: 62px; z-index: 5;
      font-size: 11px; color: #6f7688; letter-spacing: 0.03em; pointer-events: none;
    }
    #stage { cursor: grab; }
    #stage.suruklu { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <header>
    <h1>Araç Blokları<small>craft_blocks · parametrik uzay aracı kütüphanesi</small></h1>
    <div class="controls">
      <select id="palet" title="Palet">
        <option value="obsidyen" selected>Obsidyen · Şampanya</option>
        <option value="gece">Gece · Bakır</option>
        <option value="grafit">Grafit · Gümüş</option>
        <option value="fildisi">Fildişi · Petrol</option>
      </select>
      <label class="chk"><input type="checkbox" id="tel"> Tel kafes</label>
      <button id="durdur">Duraklat</button>
      <button id="tamEkran" title="Tam ekran (F)">⤢ Tam ekran</button>
    </div>
  </header>
  <div id="ipucu">Sürükle: döndür · Tekerlek: yakınlaş · Sağ tık / iki parmak: kaydır · Çift tık: araca odaklan</div>
  <div id="fxPanel" title="Motor ateşleme efekt sistemi">
    <span class="fx-baslik">Ateşleme</span>
    <select id="fxArac" title="Araç">
      <option value="rocket" selected>Roket</option>
      <option value="lander">İniş Aracı</option>
      <option value="orbiter">Yörünge Aracı</option>
      <option value="capsule">Kapsül + SM</option>
      <option value="cubesat">CubeSat</option>
    </select>
    <select id="fxTip" title="Motor tipi">
      <option value="atmosfer">Atmosfer</option>
      <option value="vakum">Vakum</option>
      <option value="hover">Hover</option>
    </select>
    <label class="gaz">Gaz <input id="gaz" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button id="atesleBtn">Ateşle</button>
  </div>
  <footer id="odaklar"></footer>

  <script type="module">
    import * as THREE from 'three';
    import {
      buildOrbiter, buildLander, buildRocket, buildCubesat, buildCapsule, CRAFT_PALETTE,
      applyCraftPalette,
    } from './craft-blocks.mjs';

    /* ---------- kamera kumandası (yumuşak bağımlılık) ---------- */
    // OrbitControls vendor'dan gelir (dış ağ YOK; importmap 'three'i çözer).
    // Yüklenemezse vitrin sabit kameralarla çalışmaya devam eder.
    let OrbitControls = null;
    try {
      ({ OrbitControls } = await import('../moon_advanced/vendor/controls/OrbitControls.js'));
    } catch (hata) {
      console.warn('OrbitControls yüklenemedi; kamera kumandası devre dışı.', hata);
    }

    /* ---------- ateşleme efekt sistemi (yumuşak bağımlılık) ---------- */
    // Sözleşme gereği bloklar birbirine sert bağımlı olamaz: import başarısız
    // olursa vitrin ateşlemesiz çalışmaya devam eder.
    let buildEngineFX = null;
    try {
      ({ buildEngineFX } = await import('./craft-effects.mjs'));
    } catch (hata) {
      console.warn('craft-effects yüklenemedi; ateşleme devre dışı.', hata);
    }

    /* ---------- paletler (deterministik) ---------- */
    const PALETLER = {
      obsidyen: CRAFT_PALETTE,
      gece:    { body: 0x1b2330, panel: 0x0d151f, accent: 0xc47a4a, metal: 0x93a1b3 },
      grafit:  { body: 0x2a2c31, panel: 0x121317, accent: 0xd7dde6, metal: 0xaab1bb },
      fildisi: { body: 0xd9d4c8, panel: 0x1a2b33, accent: 0x2e6f7e, metal: 0xb9b4a6 },
    };

    /* ---------- araç tanımları: sıra, ad, kurucu, sergi yönelimi ---------- */
    // 'z-up': araç +Z'si dünya yukarısına (kanatlar yatay);
    // 'x-up': araç +X'i yukarı (roket/kapsül dik, iniş aracı bacakları yerde).
    const TANIMLAR = [
      { id: 'cubesat', ad: 'CubeSat 3U', yap: (p) => buildCubesat({ units: 3, palette: p }), yon: 'z-up' },
      { id: 'orbiter', ad: 'Yörünge Aracı', yap: (p) => buildOrbiter({ palette: p }), yon: 'z-up' },
      { id: 'rocket',  ad: 'Roket (2 kademe)', yap: (p) => buildRocket({ stages: 2, palette: p }), yon: 'x-up' },
      { id: 'lander',  ad: 'İniş Aracı', yap: (p) => buildLander({ palette: p }), yon: 'x-up' },
      { id: 'capsule', ad: 'Kapsül + SM', yap: (p) => buildCapsule({ palette: p }), yon: 'x-up' },
    ];
    const ARALIK = 1.55;
    const FAZLAR = [0.9, 5.7, 0.4, 2.3, 4.1];   // başlangıç açıları (deterministik)
    const HIZ = 0.22;                            // rad/s — yavaş dönme sehpası

    /* ---------- sahne ---------- */
    const host = document.querySelector('#stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));   // DPR sınırı (sözleşme)
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.42;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070b);
    scene.fog = new THREE.FogExp2(0x05070b, 0.05);   // zemin uzakta sahne rengine erisin

    // Zemin + araç başına ince kaide (galeri duruşu).
    const zemin = new THREE.Mesh(
      new THREE.CircleGeometry(60, 64),
      new THREE.MeshStandardMaterial({ color: 0x030408, roughness: 1.0, metalness: 0.0 }),
    );
    zemin.rotation.x = -Math.PI / 2;
    zemin.receiveShadow = true;
    scene.add(zemin);
    for (let i = 0; i < TANIMLAR.length; i++) {
      const kaide = new THREE.Mesh(
        new THREE.CylinderGeometry(0.52, 0.58, 0.05, 48),
        new THREE.MeshStandardMaterial({ color: 0x0e1015, roughness: 0.6, metalness: 0.35 }),
      );
      kaide.position.set((i - 2) * ARALIK, 0.025, 0);
      kaide.receiveShadow = true;
      kaide.castShadow = true;
      scene.add(kaide);
    }

    // Üç noktalı ışık düzeni (sözleşmenin ışık disiplini):
    // tek anahtar ışık + yumuşak dolgu + arka jant ışığı.
    const anahtar = new THREE.DirectionalLight(0xfff1de, 3.1);      // anahtar (sıcak)
    anahtar.position.set(4.5, 7, 5.5);
    anahtar.castShadow = true;
    anahtar.shadow.mapSize.set(2048, 2048);
    anahtar.shadow.camera.left = -6; anahtar.shadow.camera.right = 6;
    anahtar.shadow.camera.top = 5; anahtar.shadow.camera.bottom = -3;
    anahtar.shadow.camera.near = 2; anahtar.shadow.camera.far = 20;
    anahtar.shadow.bias = -0.0004;
    scene.add(anahtar);
    const dolgu = new THREE.HemisphereLight(0xa7b6d4, 0x0e1014, 1.0); // yumuşak dolgu
    scene.add(dolgu);
    const jant = new THREE.DirectionalLight(0xd9c08a, 1.7);         // şampanya jant ışığı
    jant.position.set(-5, 3.2, -6);
    scene.add(jant);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);

    /* ---------- yörünge kumandası (sürükle / tekerlek / pan) ---------- */
    // Sınırlar: kamera zeminin ALTINA düşmez (maxPolarAngle), sahneden
    // kopmaz (maxDistance + maxTargetRadius), araca gömülmez (minDistance).
    let controls = null;
    let kameraKirli = false;      // controls 'change' → bir kare daha çiz
    let gecis = null;             // yumuşak kamera geçişi durumu
    if (OrbitControls) {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.rotateSpeed = 0.85;
      controls.zoomSpeed = 0.95;
      controls.panSpeed = 0.8;
      controls.minDistance = 0.42;
      controls.maxDistance = 15;
      controls.minPolarAngle = 0.10;
      controls.maxPolarAngle = Math.PI / 2 - 0.045;   // zemin düzleminin üstünde kal
      controls.maxTargetRadius = 6.0;                 // sehpa alanından uzaklaşma
      controls.target.set(0, 0.66, 0);
      const stageEl = host;
      controls.addEventListener('start', () => { gecis = null; stageEl.classList.add('suruklu'); });
      controls.addEventListener('end', () => stageEl.classList.remove('suruklu'));
      controls.addEventListener('change', () => { kameraKirli = true; kareIste(); });
    }

    /* ---------- ateşleme durumu ---------- */
    // Varsayılan tipler mantıksal eşleşmedir: iniş aracı → hover,
    // roket → atmosfer, yörünge aracı / kapsül / küpsat → vakum.
    // olcek: FX ağız yarıçapını aracın çan çıkışına oturtan el ayarı.
    const FX_AYAR = {
      rocket:  { tip: 'atmosfer', olcek: 0.42 },
      lander:  { tip: 'hover',    olcek: 0.95 },
      orbiter: { tip: 'vakum',    olcek: 0.45 },
      capsule: { tip: 'vakum',    olcek: 0.80 },
      cubesat: { tip: 'vakum',    olcek: 0.30 },
    };
    const FX_BOYLAR = { vakum: 0.95, atmosfer: 1.35, hover: 0.5 };  // craft-effects tip boyları
    let fx = null;                       // aktif buildEngineFX dönüşü
    let fxAracId = 'rocket';
    let fxTip = FX_AYAR.rocket.tip;
    let fxGaz = 0.8;
    let fxAtes = false;
    const tabanY = [];                   // araç başına kaidesiz taban yüksekliği

    /* ---------- araçların kurulumu ---------- */
    const pivotlar = [];   // dönme sehpaları
    let araclar = [];      // canlı kök gruplar

    function yonele(kok, yon) {
      // Sergi yönelimi: sözleşme eksenlerinden (X ileri, Z yukarı) dünya-yukarı (+Y) düzenine.
      if (yon === 'z-up') kok.rotation.x = -Math.PI / 2;   // araç +Z → dünya +Y
      else kok.rotation.z = Math.PI / 2;                    // araç +X → dünya +Y
    }

    function kur(paletAdi) {
      // FX aracın çocuğudur; araç sökülmeden önce ayrıca sökülüp sonra geri takılır.
      const fxVardi = !!fx;
      if (fxVardi) fxSok();
      // Eski araçları sök. Malzemeler bir araç içinde ONLARCA mesh tarafından
      // PAYLAŞILIR (m.body, m.metal, m.panel…); geometriler de yardımcılar
      // arasında tekrar kullanılabilir. Bu yüzden mesh başına değil, BENZERSİZ
      // kaynak başına bir kez dispose edilir (Set) ve FX'e ait mesh'ler
      // (userData.fx) atlanır — onların sahibi craft-effects'tir.
      const geoler = new Set(), malzemeler = new Set();
      for (const a of araclar) {
        if (a.parent) a.parent.remove(a);
        a.traverse((o) => {
          if (!o.isMesh || o.userData.fx) return;
          if (o.geometry) geoler.add(o.geometry);
          const mm = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mm) if (m) malzemeler.add(m);
        });
      }
      for (const g of geoler) g.dispose();
      for (const m of malzemeler) m.dispose();
      araclar = [];
      const p = PALETLER[paletAdi];
      TANIMLAR.forEach((t, i) => {
        let pivot = pivotlar[i];
        if (!pivot) {
          pivot = new THREE.Group();
          pivot.position.set((i - 2) * ARALIK, 0, 0);
          scene.add(pivot);
          pivotlar[i] = pivot;
        }
        const kok = t.yap(p);
        // Motor ağzı (yerel, yönelim ÖNCESİ): −X yönündeki en uç nokta çan çıkışıdır.
        const yerelBB = new THREE.Box3().setFromObject(kok);
        t.agizX = yerelBB.min.x + 0.012;
        yonele(kok, t.yon);
        kok.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        // Yere oturt: yönelimden sonra en alt nokta kaidenin 0.10 üstünde dursun.
        // ÖLÇÜM PİVOTA EKLEMEDEN ÖNCE yapılır. Box3.setFromObject dünya
        // uzayında çalışır: kök zaten pivotun çocuğuysa kutuya pivotun KENDİ
        // yükseltmesi de karışır ve tabanY = 0.15 − (yerelMin + eskiTabanY)
        // ≈ 0 çıkar; araçlar her yeniden kurmada zemine gömülüp alt parçaları
        // (bacaklar, motorlar, servis modülü) görünmez olurdu. Ebeveynsizken
        // ölçmek kutuyu aracın KENDİ çerçevesine sabitler.
        kok.updateMatrixWorld(true);
        const bb = new THREE.Box3().setFromObject(kok);
        tabanY[i] = 0.15 - bb.min.y;
        pivot.add(kok);
        pivot.position.y = tabanY[i];
        araclar.push(kok);
        telUygula();
      });
      if (fxVardi) fxTak();
    }

    /* ---------- ateşleme efekt yönetimi ---------- */
    function fxKaldirma() {
      // Dik sergilenen araçlarda alev zemine saplanmasın: alev boyu + pay kadar askı.
      const t = TANIMLAR.find((x) => x.id === fxAracId);
      if (!t || t.yon !== 'x-up') return 0;      // yatay egzozda gerek yok
      return FX_BOYLAR[fxTip] * FX_AYAR[fxAracId].olcek + 0.1;
    }
    function fxYerlestir() {
      pivotlar.forEach((pv, i) => {
        if (tabanY[i] == null) return;
        const askida = fx && TANIMLAR[i].id === fxAracId;
        pv.position.y = tabanY[i] + (askida ? fxKaldirma() : 0);
      });
    }
    function fxSok() {
      if (!fx) return;
      fx.dispose();                              // grup ebeveynden içeride ayrılır
      fx = null;
      fxYerlestir();
    }
    function fxTak() {
      fxSok();
      if (!buildEngineFX) return;
      const i = TANIMLAR.findIndex((x) => x.id === fxAracId);
      if (i < 0 || !araclar[i]) return;
      fx = buildEngineFX({
        scale: FX_AYAR[fxAracId].olcek, tip: fxTip, seed: 7,
        palette: PALETLER[document.querySelector('#palet').value],
      });
      fx.group.position.x = TANIMLAR[i].agizX;   // origin motor ağzında (yerel eksen)
      araclar[i].add(fx.group);
      fxYerlestir();
    }
    // Sabit-zaman modu: ateşleme t=0 kabul edilir, FX 1/60 sn adımlarla
    // istenen âna deterministik ilerletilir (headless doğrulama / dışa aktarım).
    function fxIleriSar(saniye) {
      if (!fx) return;
      const n = Math.max(1, Math.round(saniye / DT));
      for (let k = 0; k < n; k++) fx.update(DT, { gaz: fxGaz, atesle: fxAtes });
    }

    /* ---------- kamera: genel bakış / araç odağı (?focus=lander) ---------- */
    const sorgu = new URLSearchParams(location.search);
    const odak = sorgu.get('focus');
    const baslangicPalet = PALETLER[sorgu.get('palet')] ? sorgu.get('palet') : 'obsidyen';
    let etkinOdak = odak;   // o an çerçevelenen araç ('' → genel bakış)

    // Bir odağın (veya genel bakışın) kamera konumu + bakış hedefi.
    // Kadrajlar DEĞİŞMEDİ: ?focus= ile açılan kare eskisiyle birebir aynıdır.
    function odakKadraji(hedefId) {
      const i = TANIMLAR.findIndex((t) => t.id === hedefId);
      if (i < 0) {
        return { poz: new THREE.Vector3(0, 2.0, 6.3), hedef: new THREE.Vector3(0, 0.66, 0) };
      }
      const merkez = new THREE.Vector3((i - 2) * ARALIK, pivotlar[i].position.y + 0.05, 0);
      if (fx && hedefId === fxAracId) {
        merkez.y -= fxKaldirma() * 0.45;         // alevi de kadraja al
        return { poz: new THREE.Vector3(merkez.x + 1.3, merkez.y + 0.7, 2.2), hedef: merkez };
      }
      return { poz: new THREE.Vector3(merkez.x + 1.0, merkez.y + 0.55, 1.6), hedef: merkez };
    }

    // Anlık yerleştirme (açılış / donmuş mod): geçiş yok, tek kare.
    function kamerayiKur() {
      // FX aktifken açık odak yoksa ateşlenen araca çerçevelenir (alev dahil).
      const hedefId = etkinOdak || (fx ? fxAracId : null);
      const k = odakKadraji(hedefId);
      camera.position.copy(k.poz);
      if (controls) { controls.target.copy(k.hedef); controls.update(); }
      else camera.lookAt(k.hedef);
    }

    // Yumuşak geçiş: konum ve hedef birlikte easeInOutCubic ile taşınır —
    // anlık zıplama yok. Kullanıcı sürüklemeye başlarsa geçiş iptal olur.
    function kamerayaGit(hedefId, sure = 0.85) {
      const k = odakKadraji(hedefId);
      if (!controls || donmusMod || azaltilmis) {   // hareket yoksa doğrudan otur
        camera.position.copy(k.poz);
        if (controls) { controls.target.copy(k.hedef); controls.update(); }
        else camera.lookAt(k.hedef);
        kameraKirli = true;
        ciz();
        return;
      }
      gecis = {
        p0: camera.position.clone(), p1: k.poz,
        h0: controls.target.clone(), h1: k.hedef,
        t: 0, sure,
      };
      kareIste();
    }

    function gecisGuncelle(dt) {
      if (!gecis) return false;
      gecis.t = Math.min(gecis.sure, gecis.t + dt);
      const u = gecis.t / gecis.sure;
      const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;  // easeInOutCubic
      camera.position.lerpVectors(gecis.p0, gecis.p1, e);
      controls.target.lerpVectors(gecis.h0, gecis.h1, e);
      if (gecis.t >= gecis.sure) gecis = null;
      return true;
    }

    /* ---------- boyutlandırma (bağlanmadan ÖNCE boyut, sözleşme) ---------- */
    function boyutla() {
      const w = host.clientWidth, h = host.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    /* ---------- kumandalar ---------- */
    const telKutu = document.querySelector('#tel');
    function telUygula() {
      const acik = telKutu.checked;
      // FX parçaları (userData.fx) tel kafese dahil edilmez — additive alevde anlamsız.
      for (const a of araclar) a.traverse((o) => {
        if (o.isMesh && !o.userData.fx) o.material.wireframe = acik;
      });
    }
    telKutu.addEventListener('change', () => { telUygula(); ciz(); });

    // Palet değişimi araçları YENİDEN KURMAZ (webgl-scene-contract §2):
    // malzeme renkleri yerinde tazelenir — türetilmiş panel çerçevesi dahil.
    // Böylece sök-tak yolu (ve onunla gelen dispose sınıfı hatalar) hiç
    // çalışmaz; değişim tek karede ve tahsissiz olur.
    const paletSec = document.querySelector('#palet');
    function paletiUygula(ad) {
      const p = PALETLER[ad] || PALETLER.obsidyen;
      for (const kok of araclar) applyCraftPalette(kok, p);
      if (fx) {
        if (fx.setPalette) fx.setPalette(p);      // alev renk ailesi de tazelensin
        else { fxTak(); }                          // eski FX sürümü: yalnız FX yeniden kurulur
      }
      ciz();
    }
    paletSec.addEventListener('change', (e) => paletiUygula(e.target.value));

    let calisiyor = true;
    const durButon = document.querySelector('#durdur');
    durButon.addEventListener('click', () => {
      calisiyor = !calisiyor;
      durButon.textContent = calisiyor ? 'Duraklat' : 'Devam';
      kareIste();
      ciz();
    });
    // NOT: donmuş mod rozeti AŞAĞIDA, donmusMod tanımlandıktan SONRA kurulur.
    // (Buraya konduğunda `const donmusMod` henüz TDZ'de olduğu için modül
    //  "Cannot access 'donmusMod' before initialization" ile ölüyordu.)

    // Sahne zamanı gerçekten akıyor mu? (duraklatılmış / donmuş modda AKMAZ —
    // bu durumlarda ateşleme ve gaz değişimi deterministik sarma ile gösterilir,
    // yoksa düğmelere basılınca hiçbir şey olmuyordu.)
    const zamanAkiyor = () => calisiyor && !donmusMod;

    /* ---------- tam ekran ---------- */
    const tamEkranBtn = document.querySelector('#tamEkran');
    function tamEkranEtiket() {
      const acik = !!document.fullscreenElement;
      tamEkranBtn.textContent = acik ? '⤡ Çık' : '⤢ Tam ekran';
      tamEkranBtn.title = acik ? 'Tam ekrandan çık (ESC)' : 'Tam ekran (F)';
    }
    function tamEkranDegistir() {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => {});
    }
    tamEkranBtn.addEventListener('click', tamEkranDegistir);
    // ESC ile çıkışta da ikon/etiket senkron kalsın.
    document.addEventListener('fullscreenchange', () => {
      tamEkranEtiket();
      boyutla();
      kameraKirli = true;
      ciz();
    });
    tamEkranEtiket();
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') {
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName || '')) return;
        tamEkranDegistir();
      }
    });

    // Ateşleme kumandaları.
    const fxAracSec = document.querySelector('#fxArac');
    const fxTipSec = document.querySelector('#fxTip');
    const gazSurgu = document.querySelector('#gaz');
    const atesleBtn = document.querySelector('#atesleBtn');
    function atesleEtiket() {
      atesleBtn.textContent = fxAtes ? 'Kes' : 'Ateşle';
      atesleBtn.classList.toggle('yanik', fxAtes);
    }
    // Araç/tip değişiminde FX yeniden kurulur; yanıyorsa kararlı yanmaya
    // sarılır ki kullanıcı boş bir motora bakmasın.
    function fxYenidenKur() {
      if (!fx) return;
      fxTak();
      if (fxAtes) fxIleriSar(2.0);
      kamerayaGit(etkinOdak || fxAracId);      // zıplama değil, kısa geçiş
    }
    fxAracSec.addEventListener('change', () => {
      fxAracId = fxAracSec.value;
      fxTip = FX_AYAR[fxAracId].tip;
      fxTipSec.value = fxTip;
      fxYenidenKur();
      ciz();
    });
    fxTipSec.addEventListener('change', () => {
      fxTip = fxTipSec.value;
      fxYenidenKur();
      ciz();
    });
    // Gaz sürgüsü ANLIK etki etmeli. Zaman akmıyorken (duraklat / donmuş mod)
    // hiçbir güncelleme çalışmadığı için sürgü ölüydü: basınç dinamiğini
    // deterministik olarak oturtup tek kare çiziyoruz.
    gazSurgu.addEventListener('input', () => {
      fxGaz = parseFloat(gazSurgu.value);
      if (!zamanAkiyor()) { fxIleriSar(0.30); ciz(); }
    });
    atesleBtn.addEventListener('click', () => {
      if (!fx) { fxTak(); kamerayaGit(etkinOdak || fxAracId); }
      fxAtes = !fxAtes;
      atesleEtiket();
      // Zaman akmıyorken (duraklatılmış veya donmuş mod) fx.update hiç
      // çağrılmıyordu → düğme görsel olarak ÖLÜYDÜ. Ateşlemede belgelenen
      // orta-yanma tablosuna (t=2.0 sn), kesmede sönüm sonrasına sarıyoruz.
      if (!zamanAkiyor()) fxIleriSar(fxAtes ? 2.0 : 0.7);
      ciz();
    });
    if (!buildEngineFX) {
      for (const el of [fxAracSec, fxTipSec, gazSurgu, atesleBtn]) el.disabled = true;
    }

    // Odak çipleri. href korunur (derin bağlantı / JS'siz durum) ama tıklama
    // sayfayı yeniden YÜKLEMEZ: kamera hedefe yumuşak geçişle gider.
    const odaklar = document.querySelector('#odaklar');
    const cipler = new Map();
    function cipleriIsaretle() {
      for (const [id, el] of cipler) el.classList.toggle('on', (etkinOdak || '') === id);
    }
    function odaklan(id) {
      etkinOdak = id || '';
      cipleriIsaretle();
      const url = etkinOdak ? `?focus=${etkinOdak}` : '?';
      // Sorgu dizgisi korunur ki paylaşılan bağlantı aynı kadrajı açsın.
      history.replaceState(null, '', url + location.hash);
      kamerayaGit(etkinOdak);
    }
    function cipYap(id, ad, href) {
      const a = document.createElement('a');
      a.href = href; a.textContent = ad;
      a.addEventListener('click', (e) => { e.preventDefault(); odaklan(id); });
      odaklar.appendChild(a);
      cipler.set(id, a);
    }
    cipYap('', 'Genel bakış', '?');
    for (const t of TANIMLAR) cipYap(t.id, t.ad, `?focus=${t.id}`);
    cipleriIsaretle();

    // Çift tık: tıklanan araca odaklan (boşluğa çift tık → genel bakış).
    const isinlayici = new THREE.Raycaster();
    const fareNDC = new THREE.Vector2();
    renderer.domElement.addEventListener('dblclick', (e) => {
      const r = renderer.domElement.getBoundingClientRect();
      fareNDC.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      isinlayici.setFromCamera(fareNDC, camera);
      const vurus = isinlayici.intersectObjects(araclar, true)[0];
      if (!vurus) { odaklan(''); return; }
      let o = vurus.object, i = -1;
      while (o && i < 0) { i = araclar.indexOf(o); o = o.parent; }
      odaklan(i >= 0 ? TANIMLAR[i].id : '');
    });

    /* ---------- deterministik döngü ---------- */
    // Sanal zaman altında da deterministik olsun diye duvar saati yerine sabit adım.
    let t = 0;
    const DT = 1 / 60;
    const azaltilmis = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const disaAktarim = document.documentElement.dataset.export === 'true'
      || sorgu.get('export') === '1';           // diğer presetlerle aynı sözleşme
    // Sabit-zaman parametresi (?t=saniye): headless karede istenen ânı yakalamak
    // için sahne o âna deterministik sarılıp DONDURULUR.
    const sabitT = sorgu.has('t') ? Math.max(0, parseFloat(sorgu.get('t')) || 0) : null;
    const donmusMod = azaltilmis || disaAktarim || sabitT !== null;

    // Donmuş modda (?t= · ?export=1 · azaltılmış hareket) sahne zamanı hiç
    // akmaz; Duraklat sessizce işlevsizdir. Bu SESSİZLİK bir kez gerçek kafa
    // karışıklığına yol açtı (demo kartına ?t=2 sızmıştı: alev donuk, tornalar
    // duruyor, Duraklat tepkisiz — "bug" gibi okundu). Artık durumu söyler.
    if (donmusMod) {
      durButon.disabled = true;
      durButon.textContent = 'Donmuş kare';
      durButon.title = sabitT !== null
        ? `Sabit-zaman modu (?t=${sabitT}): sahne bu ânda dondurulmuştur.`
        : (disaAktarim ? 'Dışa aktarım modu: sahne son karede dondurulmuştur.'
                       : 'Sistem "hareketi azalt" ayarı açık: sahne dondurulmuştur.');
      durButon.style.opacity = '0.55';
      durButon.style.cursor = 'default';
    }

    function ciz() {
      pivotlar.forEach((pv, i) => { pv.rotation.y = FAZLAR[i] + HIZ * t; });
      renderer.render(scene, camera);
      kameraKirli = false;
    }

    // Kare planlayıcı: rAF boşuna dönmez. Zaman akarken kendini yeniler;
    // donmuş/duraklatılmış modda YALNIZ kamera iş yaptıkça (sürükleme
    // damping'i, odak geçişi) kare ister — sahne zamanı ilerlemeden.
    let istekId = 0;
    function kareIste() {
      if (istekId || document.hidden) return;
      istekId = requestAnimationFrame(dongu);
    }

    function dongu() {
      istekId = 0;
      if (document.hidden) return;                 // gizli sekmede rAF durur
      // Kamera donmuş modda da yaşar: controls.update() çağrılır (damping ve
      // sınırlar işlesin) ama SAHNE ZAMANI ilerlemez — ?t= tablosu ve
      // ?export=1 çıktısı kamera hareketinden etkilenmez.
      const gecisVar = gecisGuncelle(DT);
      const kameraDegisti = controls ? controls.update() : false;
      const akiyor = zamanAkiyor();
      if (akiyor) {
        t += DT;
        if (fx) fx.update(DT, { gaz: fxGaz, atesle: fxAtes });
      }
      if (akiyor || gecisVar || kameraDegisti || kameraKirli) ciz();
      if (akiyor || gecisVar || kameraDegisti) kareIste();
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) kareIste(); });

    /* ---------- başlat ---------- */
    boyutla();
    document.querySelector('#palet').value = baslangicPalet;
    kur(baslangicPalet);
    kamerayiKur();


    // Ateşleme açılış parametreleri: ?fx=1&arac=rocket&tip=atmosfer&gaz=0.8[&t=2.0]
    // (deterministik açılış; headless doğrulama sabit-zaman ?t= ile kare yakalar).
    if (sorgu.get('fx') === '1' && buildEngineFX) {
      if (FX_AYAR[sorgu.get('arac')]) fxAracId = sorgu.get('arac');
      fxTip = ['vakum', 'atmosfer', 'hover'].includes(sorgu.get('tip'))
        ? sorgu.get('tip') : FX_AYAR[fxAracId].tip;
      const g = parseFloat(sorgu.get('gaz'));
      if (Number.isFinite(g)) fxGaz = Math.min(1, Math.max(0, g));
      fxAracSec.value = fxAracId;
      fxTipSec.value = fxTip;
      gazSurgu.value = String(fxGaz);
      fxAtes = true;
      atesleEtiket();
      fxTak();
      kamerayiKur();
      // Donmuş tablo (dışa aktarım / azaltılmış hareket / ?t=): ateşleme t=0
      // kabul edilir; varsayılan tablo ORTA-YANMA t=2.0 sn'dir (belgelenmiş).
      if (donmusMod) fxIleriSar(sabitT !== null ? sabitT : 2.0);
    }

    // Deterministik palet koşumu (regresyon doğrulaması, headless):
    // ?paletdizi=gece,grafit,fildisi,obsidyen — verilen sırayla palet değişimi
    // uygulanır ve son palette durulur. Yerinde renklendirme yolunu kullanır;
    // sonuç, o paletle DOĞRUDAN açılmış sayfayla piksel olarak aynı olmalıdır.
    for (const ad of (sorgu.get('paletdizi') || '').split(',')) {
      if (PALETLER[ad]) { paletSec.value = ad; paletiUygula(ad); }
    }

    ciz();               // bildirilen tablo: t=0, fazlar başlangıç açılarında (senkron ilk kare)
    kareIste();          // donmuş modda da: zaman durur, kamera yaşar
    window.addEventListener('resize', () => { boyutla(); ciz(); });

    // Deterministik test/dışa aktarma kancası.
    window.__craft = {
      scene, camera, renderer, araclar, pivotlar, controls,
      advance(saniye) {
        const n = Math.max(1, Math.round(saniye / DT));
        for (let k = 0; k < n; k++) {
          t += DT;
          if (fx) fx.update(DT, { gaz: fxGaz, atesle: fxAtes });
        }
        ciz();
      },
      setPalette(ad) { paletSec.value = ad; paletiUygula(ad); },
      // Hata avı kancası: araçları gerçekten SÖKÜP yeniden kurar (normal
      // palet yolu artık bunu kullanmaz — yerinde renklendirme yapar).
      rebuild(ad) { paletSec.value = ad; kur(ad); kamerayiKur(); ciz(); },
      focus(id) { odaklan(id || ''); },
      // Programatik kamera (doğrulama kareleri): {poz:[x,y,z], hedef:[x,y,z]}
      kamera({ poz, hedef } = {}) {
        if (poz) camera.position.set(poz[0], poz[1], poz[2]);
        if (hedef && controls) controls.target.set(hedef[0], hedef[1], hedef[2]);
        gecis = null;
        if (controls) controls.update(); else if (hedef) camera.lookAt(hedef[0], hedef[1], hedef[2]);
        ciz();
      },
      fxDurum() { return { fx: !!fx, arac: fxAracId, tip: fxTip, gaz: fxGaz, atesle: fxAtes }; },
    };
    // Modül üst düzey await kullandığı için 'load' olayı __craft hazır olmadan
    // atabilir; gömen sayfa/koşum bu olayı bekleyebilsin.
    window.dispatchEvent(new CustomEvent('craft:hazir', { detail: window.__craft }));
  </script>
</body>
</html>
