<meta charset="utf-8">

<title>Icon Library — create-scientific-visuals</title>
<style>
  :root { --bg:#0F1013; --panel:#16181D; --line:#23262E; --gold:#D3B26A; --text:#E8E4DA; --dim:#8A8F9B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI",system-ui,sans-serif; padding:32px 40px 64px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:16px; margin-bottom:8px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:.02em; }
  h1 em { color:var(--gold); font-style:normal; }
  .meta { color:var(--dim); font-size:12.5px; }
  .bar { display:flex; gap:12px; align-items:center; margin:20px 0 28px; flex-wrap:wrap; }
  input#q { background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:10px 14px; width:340px; max-width:100%; font-size:14px; outline:none; }
  input#q:focus { border-color:var(--gold); }
  #count { color:var(--dim); font-size:12.5px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:18px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; transition:border-color .15s, transform .15s; }
  .cell:hover { border-color:var(--gold); transform:translateY(-2px); }
  .cell svg { width:30px; height:30px; color:var(--gold); }
  .cell .nm { font-size:11px; color:var(--text); text-align:center; word-break:break-word; }
  .cell .src { font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .cell .src.tabler, .cell .src.phosphor { color:var(--gold); opacity:.75; }
  .hidden { display:none; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#101013; padding:8px 18px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.on { opacity:1; }
</style>
</head>

const frag = document.createDocumentFragment();
for (const ic of ICONS) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.dataset.k = (ic.name + ' ' + ic.tags.join(' ')).toLowerCase();
  cell.innerHTML = '<svg aria-hidden="true"><use href="#i-' + ic.name + '"></use></svg>' +
    '<span class="nm">' + ic.name + '</span>' +
    '<span class="src ' + ic.set + '">' + (ic.set === 'lucide' ? '&nbsp;' : ic.set) + '</span>';
  cell.title = ic.set + ' · ' + ic.style + '\n' + ic.tags.join(', ');
  cell.addEventListener('click', () => {
    const snippet = '<svg class="icon"><use href="sprite.svg#i-' + ic.name + '"></use></svg>';
    if (navigator.clipboard) navigator.clipboard.writeText(snippet).catch(()=>{});
    const t = document.getElementById('toast');
    t.textContent = 'Kopyalandı: i-' + ic.name;
    t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1400);
  });
  frag.appendChild(cell);
}
grid.appendChild(frag);
const cells = [...grid.children];
const count = document.getElementById('count');
function apply(q) {
  q = q.trim().toLowerCase();
  let n = 0;
  for (const c of cells) {
    const show = !q || c.dataset.k.includes(q);
    c.classList.toggle('hidden', !show);
    if (show) n++;
  }
  count.textContent = n + ' / ' + ICONS.length;
}
document.getElementById('q').addEventListener('input', e => apply(e.target.value));
apply('');
