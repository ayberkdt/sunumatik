<!doctype html><html lang="tr"><head><meta charset="utf-8">
<title>Alan İkon Seti — 224 ikon</title><style>
:root{--bg:#0F1013;--sf:#1A1C21;--ink:#F4EEE1;--mut:#A9A296;--acc:#D3B26A;--rule:#2E3037}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:15px/1.5 Bahnschrift,'Segoe UI',sans-serif;padding:28px 32px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
input{background:var(--sf);border:1px solid var(--rule);color:var(--ink);
padding:9px 14px;border-radius:9px;min-width:260px;font:inherit}
button{background:var(--sf);border:1px solid var(--rule);color:var(--ink);
padding:8px 14px;border-radius:9px;cursor:pointer;font:inherit}
button.on{border-color:var(--acc);color:var(--acc)}
#count{color:var(--mut);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.cell{background:var(--sf);border:1px solid var(--rule);border-radius:12px;
padding:14px 8px 10px;text-align:center;cursor:pointer;color:var(--acc)}
.cell:hover{border-color:var(--acc)}
.cell svg{width:34px;height:34px}
.cell .nm{display:block;margin-top:8px;font-size:10.5px;color:var(--ink);
word-break:break-word;line-height:1.25}
.cell .fm{display:block;font-size:9.5px;color:var(--mut)}
.cell.hidden{display:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--acc);
color:#191307;padding:9px 18px;border-radius:9px;font-weight:700;opacity:0;transition:.2s}
#toast.on{opacity:1}</style></head><body>

const grid=document.getElementById('grid');

  const c=document.createElement('div');c.className='cell';

    '<span class="nm">'+ic.label_tr+'</span><span class="fm">'+ic.name+'</span>';
  c.title=ic.name+' · '+(FAM[ic.family]||ic.family)+'\n'+ic.tags.join(', ');

    t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1100);};

let fam='',q='';
function apply(){let n=0;
  for(const c of grid.children){const ok=(!fam||c.dataset.fam===fam)&&(!q||c.dataset.k.includes(q));
    c.classList.toggle('hidden',!ok);if(ok)n++;}
  document.getElementById('count').textContent=n+' / '+ICONS.length;}
