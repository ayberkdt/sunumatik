<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Science icon library. 24x24 grid, 1.8px stroke, round caps, currentColor.
       Functional wayfinding marks (agenda rows, section tags, callouts, footers) —
       not illustrations and not data. Usage:
       <svg class="icon" viewBox="0 0 24 24"><use href="science-icons.svg#i-telescope"/></svg>
       Render at 24–48px; keep one consistent size per context. -->

  <symbol id="i-telescope" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12.5 L17 5 L20.5 10 L7.5 15.5 Z"/>
      <path d="M9 15 L7 21 M13 13.5 L16 21"/>
      <circle cx="19" cy="7.4" r="1.1"/>
    </g>
  </symbol>

  <symbol id="i-satellite" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9.6" y="9.6" width="4.8" height="4.8" transform="rotate(45 12 12)"/>
      <path d="M4 7 L8 3 L10.5 5.5 L6.5 9.5 Z"/>
      <path d="M13.5 16.5 L17.5 12.5 L20 15 L16 19 Z" transform="rotate(180 16.75 15.75)"/>
      <path d="M14.5 9.5 L17 7"/>
    </g>
  </symbol>

  <symbol id="i-rocket" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 C14.5 5 15.5 9 15 13 L9 13 C8.5 9 9.5 5 12 3 Z"/>
      <path d="M9 13 L6.5 16.5 L9.5 15.5 M15 13 L17.5 16.5 L14.5 15.5"/>
      <path d="M12 16 L12 20"/>
      <circle cx="12" cy="8.5" r="1.4"/>
    </g>
  </symbol>

  <symbol id="i-orbit" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <ellipse cx="12" cy="12" rx="9" ry="5" transform="rotate(-20 12 12)"/>
      <circle cx="12" cy="12" r="2.4"/>
      <circle cx="19.5" cy="8.2" r="1.3" fill="currentColor" stroke="none"/>
    </g>
  </symbol>

  <symbol id="i-planet" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="5.2"/>
      <path d="M2.5 14.5 C6 16.5 18 16.5 21.5 9.5" />
