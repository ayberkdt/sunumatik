      <path d="M12 3.5 L14.3 9.7 L20.5 12 L14.3 14.3 L12 20.5 L9.7 14.3 L3.5 12 L9.7 9.7 Z"/>
    </g>
  </symbol>

  <symbol id="i-spectrum" viewBox="0 0 24 24">
