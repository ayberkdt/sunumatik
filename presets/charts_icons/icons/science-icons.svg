      <path d="M9.5 7 C6.5 8 5 10.5 5 14 L5 17 L9.5 17 L9.5 12.5 L6.8 12.5 C7 10.5 8 9 9.5 8.2 Z"/>
      <path d="M19 7 C16 8 14.5 10.5 14.5 14 L14.5 17 L19 17 L19 12.5 L16.3 12.5 C16.5 10.5 17.5 9 19 8.2 Z"/>
