      <circle cx="4.5" cy="7" r="2"/><circle cx="4.5" cy="17" r="2"/>
      <circle cx="12" cy="4.5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19.5" r="2"/>
      <circle cx="19.5" cy="12" r="2"/>
      <path d="M6.3 6.2 L10.2 5 M6.4 8 L10.3 11.2 M6.4 16 L10.3 12.8 M6.3 17.8 L10.2 19 M13.9 5.3 L17.9 10.9 M14 12 L17.5 12 M13.9 18.7 L17.9 13.1"/>
    </g>
  </symbol>

  <symbol id="i-gauge" viewBox="0 0 24 24">
