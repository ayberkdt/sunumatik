      <path d="M4 16.5 A9 9 0 0 1 20 16.5"/>
      <path d="M12 16.5 L16.5 9.5"/>
      <circle cx="12" cy="16.5" r="1.4" fill="currentColor" stroke="none"/>
      <path d="M5.5 13 L6.8 13.8 M12 7.5 L12 9 M18.5 13 L17.2 13.8"/>
