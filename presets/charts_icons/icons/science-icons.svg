      <rect x="6.5" y="6.5" width="11" height="11" rx="1.6"/>
      <rect x="10" y="10" width="4" height="4"/>
      <path d="M9 6.5 L9 3.5 M15 6.5 L15 3.5 M9 20.5 L9 17.5 M15 20.5 L15 17.5 M6.5 9 L3.5 9 M6.5 15 L3.5 15 M20.5 9 L17.5 9 M20.5 15 L17.5 15"/>
