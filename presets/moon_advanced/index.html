<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lunaris Vanilla Preset</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <link rel="stylesheet" href="../moon_react_source/components/moon_react_source.css">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #020308; }
    main { width: 100%; height: 100%; padding: 24px; }
    main > div { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <main><div id="host"></div></main>
  <script type="module">
    import { mountLunaris } from './lunaris-moon.mjs';
    const lunaris = await mountLunaris(document.querySelector('#host'), {
      assetBaseUrl: '../moon_react_source/public/lunaris',
      title: 'A spacecraft does not follow one lunar gravity field',
    });
    lunaris.figure.focus();
  </script>
