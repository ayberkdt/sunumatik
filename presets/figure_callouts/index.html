<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Figure Callout Preset — figür üzerinde adım adım anlatım</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="../color_themes/palette-library.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-canvas); color: var(--color-ink);
      font-family: ui-sans-serif, system-ui, sans-serif; padding: 40px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 28px; }
    p.hint { color: var(--color-muted); font-size: 16px; }
  </style>
</head>
<body data-palette="graphite-ember">
  <main>
    <h1>Figür işaretleme — ok tuşlarıyla gezin</h1>
    <p class="hint">Figüre tıklayıp ← → ile adımlar arasında geçin. Her adım bir iddia taşır.</p>
    <div id="fig"></div>
  </main>
  <script type="module">
    import { mountFigureStory } from './figure-callout.mjs';

    /* kendi kendine yeten örnek görsel: sahte bir uydu ölçüm haritası (SVG data-URI) */
    const demoSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'>
      <rect width='800' height='500' fill='%231d2430'/>
      <g opacity='.85'>${Array.from({length: 900}, (_, i) => {
        const x = (i * 137.5) % 800, y = (i * 89.7) % 500;
        const v = Math.sin(x / 90) * Math.cos(y / 70) + Math.sin((x + y) / 55);
        const c = v > .9 ? '%23e8804a' : v > .3 ? '%23b8925a' : v > -.4 ? '%234a6a7a' : '%23273444';
        return `<circle cx='${x.toFixed(0)}' cy='${y.toFixed(0)}' r='6' fill='${c}'/>`;
      }).join('')}</g>
      <rect x='530' y='90' width='190' height='130' fill='%23e8804a' opacity='.16'/>
      <text x='40' y='465' fill='%23aab6c4' font-size='24' font-family='monospace'>SIM: yuzey anomali haritasi (temsili)</text>
    </svg>`;
    const src = 'data:image/svg+xml;utf8,' + encodeURIComponent(demoSvg).replace(/%2523/g, '%23');

    const fig = mountFigureStory(document.querySelector('#fig'), {
      src,
      alt: 'Temsilî yüzey anomali haritası',
      steps: [
        { caption: 'Kuzeydoğu çeyreğinde anomali kümeleniyor — arka plan bunun dışında düz.',
          box: { x: 62, y: 14, w: 28, h: 30 }, dim: true },
        { caption: 'Kümenin merkezindeki üç nokta eşiğin iki katını aşıyor.',
          circle: { x: 76, y: 29, r: 7 }, lens: { x: 76, y: 29, r: 14, zoom: 2.4 } },
        { caption: 'Anomali sırtı güneybatıya, ölçüm koridoru boyunca uzanıyor.',
          arrow: { x1: 70, y1: 36, x2: 32, y2: 72 }, dim: false },
      ],
    });
    fig.figure.focus();
    window.__fig = fig;
  </script>
</body>
</html>
